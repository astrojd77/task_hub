[project]
name = "task-hub-backend"
version = "0.1.0"
description = "Task Hub — import, review, commit, and route work items"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "python-multipart>=0.0.17",
    "httpx>=0.27",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
oracle = ["oracledb>=2.5"]
email = ["extract-msg>=0.52"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "extract-msg>=0.52",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "DTZ", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom is a call in a default argument. This is
# the framework's intended usage, not the mutable-default bug B008 hunts for.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.File",
    "fastapi.Form",
]

[tool.ruff.lint.per-file-ignores]
# Timestamps in this schema are naive UTC by convention (see models/task.py),
# so test fixtures build naive datetimes deliberately.
"tests/*" = ["DTZ001"]
# Alembic's generated env/migration scaffolding has its own conventions.
"alembic/*" = ["F403", "F405", "I001"]
