apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The Secret is intentionally absent — see secret.example.yaml. Create it with
# `oc create secret generic task-hub-secret ...` before applying this.
resources:
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml
  - job-migrate.yaml

# includeSelectors: false matters. The deprecated `commonLabels` would fold
# part-of into spec.selector.matchLabels, and a Deployment's selector is
# immutable — changing or removing the label later would make `oc apply` fail
# and force a delete/recreate.
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: task-hub

# Point both the Deployment and the migration Job at your image in one place.
#
#   external registry:
#     newName: quay.io/your-org/task-hub
#     newTag: 0.1.0
#
#   in-cluster build (see ../incluster-build):
#     newName: image-registry.openshift-image-registry.svc:5000/YOUR-NAMESPACE/task-hub
#     newTag: latest
images:
  - name: task-hub
    newName: task-hub
    newTag: latest
  # Flyway applies the migrations. Repoint at your internal mirror; the tag is
  # pinned rather than floating so a migration run is reproducible.
  - name: flyway
    newName: docker.io/flyway/flyway
    newTag: 11-alpine
