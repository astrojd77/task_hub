# REFERENCE ONLY — deliberately not listed in kustomization.yaml.
#
# If this were applied by `oc apply -k`, a placeholder connection string could
# reach a real cluster. Create the Secret out of band instead:
#
#   oc create secret generic task-hub-secret \
#     --from-literal=DATABASE_URL='oracle+oracledb://USER:PASSWORD@HOST:1521/?service_name=YOUR_SERVICE'
#
# Rotate it with the same command plus `--dry-run=client -o yaml | oc replace -f -`,
# then `oc rollout restart deployment/task-hub`.
#
# Do not commit a filled-in copy of this file.
apiVersion: v1
kind: Secret
metadata:
  name: task-hub-secret
  labels:
    app.kubernetes.io/name: task-hub
type: Opaque
stringData:
  # python-oracledb runs in thin mode — no Oracle Instant Client on the image.
  DATABASE_URL: "oracle+oracledb://USER:PASSWORD@HOST:1521/?service_name=YOUR_SERVICE"

  # Postgres alternative, if this environment is not on Oracle:
  # DATABASE_URL: "postgresql+psycopg://USER:PASSWORD@HOST:5432/taskhub"

  # Phase 4+ (Jira source and destination). Leave unset until then and drop
  # "jira" from ENABLED_SOURCES / ENABLED_DESTINATIONS in the ConfigMap.
  # JIRA_BASE_URL: "https://your-org.atlassian.net"
  # JIRA_EMAIL: "you@example.com"
  # JIRA_API_TOKEN: "..."
