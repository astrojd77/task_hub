apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# In-cluster build path: everything in base, plus an ImageStream and
# BuildConfig, plus a trigger so a finished build rolls out automatically.
resources:
  - ../base
  - buildconfig.yaml

patches:
  - path: patch-image-trigger.yaml
    target:
      kind: Deployment
      name: task-hub
